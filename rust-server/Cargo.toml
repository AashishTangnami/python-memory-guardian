[package]
name = "guardian-server"
version = "1.4.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "time", "sync"] }
tower-lsp = "0.20"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
